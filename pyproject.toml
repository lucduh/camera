[project]
name = "donut-camera"
version = "0.1.0"
description = "Reproducible Donut experiments for profiling, attention, and structured decoding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "torch>=2.11",
    "tqdm>=4.68",
    "transformers>=5.12",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]
